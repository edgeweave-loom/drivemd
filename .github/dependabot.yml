version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # A Playwright update also needs the e2e job's image updated by hand
      # (see docs/development.md), so it comes on its own rather than holding
      # up others.
      playwright:
        patterns: ["@playwright/test"]
      npm-minor-and-patch:
        update-types: [minor, patch]
        # Listing the playwright group first did not keep it out.
        exclude-patterns: ["@playwright/test"]
    ignore:
      # Node.js types follow the Node.js 24 line that package.json's devEngines
      # pins.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
      include: scope
