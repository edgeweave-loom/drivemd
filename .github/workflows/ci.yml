name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - name: Require the staging configuration
        if: github.ref == 'refs/heads/dev' && vars.FIREBASE_PROJECT_ID != ''
        run: |
          for name in VITE_GOOGLE_CLIENT_ID FIREBASE_HOSTING_SITE GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::Set the $name repository variable."
              missing=1
            fi
          done
          exit "${missing:-0}"
        env:
          FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify package signatures and provenance
        run: npm audit signatures
      - name: Block malware and critical advisories in any dependency
        run: npm audit --audit-level=critical
      - name: Block any advisory in the dependencies that ship
        run: npm audit --omit=dev --audit-level=low
      - run: npm run lint
      - run: npm run format:check
      - name: Test with coverage thresholds
        run: npm run coverage
      - name: Type-check and build
        run: npm run build
      - name: Keep the build for the staging deploy
        if: github.ref == 'refs/heads/dev' && vars.FIREBASE_PROJECT_ID != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  zizmor:
    name: Audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  # Only this job can get Google credentials, and it runs no build tooling:
  # it deploys the dist/ that the check job built.
  deploy-staging:
    name: Deploy staging
    needs: [check, zizmor]
    if: github.ref == 'refs/heads/dev' && vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # exchanged for Google credentials through Workload Identity Federation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Deploy to the staging site on Firebase Hosting
        run: |
          npm exec --no -- firebase target:apply hosting app "$FIREBASE_HOSTING_SITE" --project "$FIREBASE_PROJECT_ID"
          npm run deploy -- --project "$FIREBASE_PROJECT_ID"
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
