name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      site: ${{ steps.site.outputs.site }}
      version: ${{ steps.version.outputs.version }}
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      # A push to dev deploys staging, and one to main production, once its
      # site is set; nothing else deploys.
      - name: Pick the site to deploy, and require its configuration
        id: site
        if: vars.FIREBASE_PROJECT_ID != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          case "$GITHUB_REF" in
            refs/heads/dev) site=$FIREBASE_HOSTING_SITE ;;
            refs/heads/main)
              site=$PRODUCTION_FIREBASE_HOSTING_SITE
              [ -n "$site" ] || exit 0
              ;;
            *) exit 0 ;;
          esac
          for name in VITE_GOOGLE_CLIENT_ID FIREBASE_HOSTING_SITE GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::Set the $name repository variable."
              missing=1
            fi
          done
          if [ "$FIREBASE_HOSTING_SITE" = "$PRODUCTION_FIREBASE_HOSTING_SITE" ]; then
            echo "::error::Give staging and production sites of their own."
            missing=1
          fi
          [ -z "${missing:-}" ] || exit 1
          echo "site=$site" >> "$GITHUB_OUTPUT"
        env:
          FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
          PRODUCTION_FIREBASE_HOSTING_SITE: ${{ vars.PRODUCTION_FIREBASE_HOSTING_SITE }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      # The build names its version from the tags and the history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # package.json names the next release, and a release PR must not name
      # one already out: the release job tags each release once it is live.
      - name: Read the version, and require a release's to be new
        id: version
        run: |
          version=$(jq -r .version package.json)
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json's version, $version, is not MAJOR.MINOR.PATCH."
            exit 1
          fi
          if [ "$GITHUB_BASE_REF" = main ]; then
            tag=$(git ls-remote origin "refs/tags/v$version")
            if [ -n "$tag" ]; then
              echo "::error::$version is already released: give package.json the next version on dev."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify package signatures and provenance
        run: npm audit signatures
      - name: Block malware and critical advisories in any dependency
        run: npm audit --audit-level=critical
      - name: Block any advisory in the dependencies that ship
        run: npm audit --omit=dev --audit-level=low
      # The same checks as the pre-push hook (.githooks/pre-push).
      - name: Lint, check the format, test with coverage thresholds, type-check and build
        run: npm run check
      - name: Keep the build for the deploy
        if: steps.site.outputs.site != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  zizmor:
    name: Audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Microsoft's Playwright image holds the browsers and their system
    # libraries, which apt would otherwise install from an Ubuntu mirror that
    # stalls. Its version follows @playwright/test's: see the README.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      # The runner's user, who owns the workspace, rather than root.
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the image's Playwright to be the locked one
        run: |
          image=$(node -p "JSON.parse(fs.readFileSync('/ms-playwright/.docker-info', 'utf8')).driverVersion")
          locked=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")
          if [ "$image" != "$locked" ]; then
            echo "::error::The e2e job's image has Playwright $image, and package-lock.json $locked: update the image in ci.yml."
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test the built app in both browsers, under Hosting's headers
        run: npm run e2e

  # Only this job can get Google credentials, and it runs no build tooling:
  # it deploys the dist/ that the check job built, from dev to staging and from
  # main to production.
  deploy:
    name: Deploy
    needs: [check, e2e, zizmor]
    if: needs.check.outputs.site != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # exchanged for Google credentials through Workload Identity Federation
    steps:
      - name: Deploy only the branch's latest commit
        # A re-run of an older run would put its older build back.
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF_NAME has moved on since this run, whose build is older."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Deploy to the branch's site on Firebase Hosting
        run: |
          npm exec --no -- firebase target:apply hosting app "$FIREBASE_HOSTING_SITE" --project "$FIREBASE_PROJECT_ID"
          npm run deploy -- --project "$FIREBASE_PROJECT_ID"
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_HOSTING_SITE: ${{ needs.check.outputs.site }}

  # Once production serves a release, its merge commit gets the tag
  # v<version> and a GitHub release whose notes are the commit's body.
  release:
    name: Release
    needs: [check, deploy]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # creates the tag and the release
    steps:
      - name: Tag the release and publish its notes
        run: |
          tag=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}" | tail -n 1 | cut -f1)
          if [ "$tag" = "$GITHUB_SHA" ]; then
            echo "v$VERSION already tags this commit."
            exit 0
          fi
          if [ -n "$tag" ]; then
            echo "::error::v$VERSION already tags another commit, $tag."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.message | tail -n +3 > notes.md
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
