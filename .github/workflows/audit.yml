name: Audit

# GitHub's dependency graph cannot read pnpm 12's lockfile yet
# (dependabot/dependabot-core#15904), so Dependabot raises no security alert.
# This checks the locked dependencies against new advisories every day,
# between pushes, and fails when one appears.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Block critical advisories in any dependency
        run: pnpm audit --audit-level critical
      - name: Block any advisory in the dependencies that ship
        run: pnpm audit --prod --audit-level low
